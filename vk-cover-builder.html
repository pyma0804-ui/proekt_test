<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обложка ВК — генератор</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      color: #e6edf3;
      padding: 24px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p.lead {
      margin: 0 0 20px;
      color: #8b949e;
      font-size: 0.95rem;
      max-width: 52ch;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .canvas-box {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }
    label.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #238636;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
    }
    label.btn:hover { background: #2ea043; }
    input[type="file"] { display: none; }
    button#download {
      padding: 10px 18px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
    }
    button#download:hover { background: #388bfd; }
    button#download:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .hint {
      font-size: 0.8rem;
      color: #6e7681;
      margin-top: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Обложка для рабочей страницы ВКонтакте</h1>
    <p class="lead">
      Размер 1590×400 px — подходит для обложки сообщества. Загрузите фото профиля и скачайте PNG.
    </p>
    <div class="canvas-box">
      <canvas id="cover" width="1590" height="400"></canvas>
    </div>
    <div class="controls">
      <label class="btn" for="avatar-input">Выбрать аватар</label>
      <input id="avatar-input" type="file" accept="image/*">
      <button type="button" id="download">Скачать vk-cover.png</button>
    </div>
    <p class="hint">
      Совет: возьмите аватар из ВК (правый клик по фото → «Сохранить изображение») или любой квадратный портрет — он встанет в круг справа.
    </p>
  </div>
  <script>
(function () {
  const W = 1590;
  const H = 400;
  const canvas = document.getElementById("cover");
  const ctx = canvas.getContext("2d");
  let avatarImg = null;

  const OFFER = {
    line1: "Результат, который вы почувствуете",
    line2: "уже с первого дня",
    sub: "Профессиональная сеть · Ваш следующий шаг — здесь",
  };

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0a5fc4");
    g.addColorStop(0.45, "#0057b8");
    g.addColorStop(1, "#003366");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "rgba(255,255,255,0.04)";
    for (let i = 0; i < 24; i++) {
      const x = (i * 137) % W;
      const y = (i * 89 + i * i) % H;
      ctx.beginPath();
      ctx.arc(x, y, 80 + (i % 5) * 12, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawText() {
    const x = 72;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;

    ctx.fillStyle = "#ffffff";
    ctx.font = '700 52px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(OFFER.line1, x, 168);
    ctx.fillText(OFFER.line2, x, 232);

    ctx.shadowBlur = 4;
    ctx.font = '400 26px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(OFFER.sub, x, 296);

    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
  }

  function drawAvatarCircle() {
    const cx = W - 210;
    const cy = H / 2;
    const r = 132;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    if (avatarImg && avatarImg.complete && avatarImg.naturalWidth) {
      const iw = avatarImg.naturalWidth;
      const ih = avatarImg.naturalHeight;
      const scale = Math.max((2 * r) / iw, (2 * r) / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      ctx.drawImage(avatarImg, cx - dw / 2, cy - dh / 2, dw, dh);
    } else {
      ctx.fillStyle = "#0d2847";
      ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = '22px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Загрузите аватар", cx, cy - 10);
      ctx.font = '16px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fillText("кнопка выше", cx, cy + 18);
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 7;
    ctx.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawText();
    drawAvatarCircle();
  }

  document.getElementById("avatar-input").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        avatarImg = img;
        render();
      };
      img.onerror = function () {
        avatarImg = null;
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("download").addEventListener("click", function () {
    const a = document.createElement("a");
    a.download = "vk-cover.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });

  render();
})();
  </script>
</body>
</html>
